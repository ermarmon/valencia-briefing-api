name: Valencia Briefing API v2
version: "2.0.0"
slug: valencia_briefing_api
description: >
  Agregador local de noticias y eventos de Valencia.
  Lee feeds RSS/Atom configurables, filtra, deduplica, prioriza
  y expone un JSON limpio para Home Assistant.
url: https://github.com/local/valencia-briefing
arch:
  - amd64
startup: application
boot: auto

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "API HTTP principal del briefing"

# El add-on necesita leer/escribir en /config para feeds.yaml
# y en /data para la caché JSON persistente.
map:
  - config:rw # /config del host → /config dentro del contenedor
  - data:rw # /data del add-on → /data dentro del contenedor (persistente)

init: false

options:
  max_items: 20
  max_age_hours: 48
  cache_ttl_minutes: 60
  log_level: "info"

schema:
  max_items: int(5,50)
  max_age_hours: int(6,168)
  cache_ttl_minutes: int(5,1440)
  log_level: list(debug|info|warning|error)

